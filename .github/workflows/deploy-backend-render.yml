name: Deploy backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/deploy-backend-render.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-backend
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate Flask API
        env:
          TODO_DATABASE: ${{ runner.temp }}/validation.sqlite3
        run: |
          python - <<'PY'
          from backend.app import app

          client = app.test_client()
          response = client.get('/api/health')
          assert response.status_code == 200
          assert response.get_json() == {'status': 'ok'}
          print('Flask health check passed')
          PY

      - name: Trigger Render deployment
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Use Render native auto-deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo "Validation passed. Configure RENDER_DEPLOY_HOOK_URL to trigger Render from this workflow."